llm:
  orchestrator:
    base_url: http://127.0.0.1:11800
    api: openai
    model: qwen3.8-128k
    provider: qwythos
    ctx: 131072
    context_budget: 120000
    max_tokens: 8192
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    repeat_penalty: 1.05
    enable_thinking: true
    preserve_thinking: false
    thinking_budget_tokens: -1
    cache_prompt: true
    id_slot: 0
    vision: auto
    fallbacks:
    - name: github_models
      provider: github
      base_url: https://models.github.ai/inference
      model: openai/gpt-4o
      api_key_env: GITHUB_TOKEN
    - name: groq_cloud
      provider: groq
      base_url: https://api.groq.com/openai/v1
      model: llama-3.3-70b-versatile
      api_key_env: GROQ_API_KEY
    - name: openrouter_free
      provider: openrouter
      base_url: https://openrouter.ai/api/v1
      model: meta-llama/llama-3.3-70b-instruct:free
      api_key_env: OPENROUTER_API_KEY
    launch:
      cmd:
      - powershell
      - -File
      - C:\Users\soyko\Documents\Ollama\docker\llamacpp\start-qwythos-server.ps1
      - -CudaDevices
      - '1'
      - -WithVision
      cwd: C:\Users\soyko\Documents\Ollama\docker\llamacpp
      autostart: false
      parallel: 1
      expect_total_slots: 1
      extra_args:
      - --cache-ram
      - '0'
      - --cache-idle-slots
      - --ctx-checkpoints
      - '0'
  atomic:
    base_url: http://127.0.0.1:11800
    api: openai
    model: qwen3.8-128k
    provider: qwen3_json
    ctx: 131072
    max_tokens: 8192
    temperature: 0.15
    enable_thinking: false
    preserve_thinking: false
    thinking_budget_tokens: 0
    cache_prompt: true
    launch:
      cmd:
      - powershell
      - -File
      - C:\Users\soyko\Documents\Ollama\docker\llamacpp\start-qwythos-atomic.ps1
      - -CudaDevices
      - '0'
      cwd: C:\Users\soyko\Documents\Ollama\docker\llamacpp
      autostart: false
      parallel: 1
      profile: longctx
      expect_total_slots: 1
      extra_args:
      - --cache-ram
      - '0'
      - --cache-idle-slots
      - --ctx-checkpoints
      - '0'
embeddings:
  base_url: http://127.0.0.1:11438
  api: ollama
  model: nomic-embed-text
backends:
  gate:
    enabled: true
    orch_slots: 1
    atomic_slots: 1
    embed_slots: 1
mcp:
  python_exe: C:\Users\soyko\Documents\nina-mcp\.venv\Scripts\python.exe
  client_py: C:\Users\soyko\Documents\nina-mcp\test_client.py
help:
  top_k: 5
  min_similarity: 0.35
  max_inject_tokens: 4000
skills:
  root: ./skills
  index: ./skills/_index.json
  rebuild_on_start: false
sessions:
  dir: ./sessions
  auto_save: true
rules:
  enabled: true
  path: ./RULES.md
os_invariants:
  os: windows
  shell: powershell
  path_style: absolute
  mandatory_primitives:
  - Operating system is Windows. PowerShell (pwsh) executions are preferred as the
    main resort.
  - Never invoke linux/bash tools or commands (no bash, no WSL, no ls/cat/grep in
    shell commands).
  - Never use cd command inside tools (rely on Cwd arguments).
  - Always use absolute paths when referencing directories/files.
ui:
  streaming: true
  markdown: true
  stats: true
  checkpoint_every: 4
  delegate_terminal: auto
idle_loop:
  enabled: true
  tick_interval: 2.0
  health_check_interval: 30.0
  dream_check_interval: 60.0
  alert_check_interval: 3.0
